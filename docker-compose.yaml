version: "3.9"

services:
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    ports:
      - "11434:11434"
    restart: always
    volumes:
      - ollama:/root/.ollama

#    GPU Support
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [ gpu ]

  open-webui:
#    https://docs.openwebui.com/getting-started/quick-start/
    image: ghcr.io/open-webui/open-webui:main
    container_name: open-webui
    depends_on:
      - ollama
    environment:
      - WEBUI_URL=http://localhost:8080
      - OLLAMA_BASE_URL=http://ollama:11434
#      WEBUI_AUTH=false is Single-User Mode (no login)
      - WEBUI_AUTH=false
#      - ENABLE_LOGIN_FORM=false
#      - ENABLE_SIGNUP=false
#      - ENABLE_OAUTH_SIGNUP=false
    volumes:
      - open-webui:/app/backend/data
    ports:
      - "8080:8080"
    restart: always

volumes:
  ollama:
  open-webui:
